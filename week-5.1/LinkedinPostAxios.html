<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>LinkedIn</title>

    <head>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.6/axios.min.js"></script>                    //in case of script tag we can use this specific link to import the libraries

    </head>
    <body>
        Posts
        <div id="posts"></div>
        <script>
            async function getRecentPost(){
                console.log("before sending request");
                const response = await fetch("https://jsonplaceholder.typicode.com/posts/1");                        //it automatically converts into json file
                
                document.getElementById("posts").innerHTML = response.data.title ;
                
            }
            getRecentPost();
