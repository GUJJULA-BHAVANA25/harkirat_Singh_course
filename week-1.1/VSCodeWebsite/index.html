<head>
    <title>
        Visual Studio Code
    </title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="header">
        <ul>
            <img src="images/VSCode.png" style="width: 25px; height: 25px; left: -168px; position: relative;">
                
            <li class="VSCode-Link">
               <a href="https://code.visualstudio.com/">Visual Studio Code</a>
            </li>
            <li class="Docs-Link">
                <a href="https://code.visualstudio.com/docs">Docs</a>
            </li>
            <li class="Updates-Link">
                <a href="https://code.visualstudio.com/updates/v1_96">Updates</a>
            </li>
            <li class="Blog-Link">
                <a href="https://code.visualstudio.com/blogs/2024/12/18/free-github-copilot">Blog</a>
            </li>
            <li class="API-Link">
                <a href="https://code.visualstudio.com/api">API</a>
            </li>
            <li class="Extensions-Link">
                <a href="https://marketplace.visualstudio.com/VSCode">Extensions</a>
            </li>
            <li class="FAQ-Link">
                <a href="https://code.visualstudio.com/docs/supporting/faq">FAQ</a>
            </li>
            <li class="GithubCopilot-Link">
                <a href="https://code.visualstudio.com/docs/copilot/overview">Github Copilot</a>
            </li>

            <li>
                <button class="theme">
                    <img class="theme-icon-light" src="https://code.visualstudio.com/assets/icons/theme-light.svg" alt="Switch to dark theme">
                </button>
            </li>
            <li class="search">
                <form class="nav-search search-form" role="search" aria-label="Search">
                    <div class="input-group" role="presentation">
                        <input type="text" name="q" class="search-box form-control" placeholder="Search Docs" aria-label="Search-text">
                        <span class="input-group-btn">
                            <button tabindex="0" class="btn" type="submit" aria-label="Search">
                                <img class="search-icon-dark" src="https://code.visualstudio.com/assets/icons/search-dark.svg" alt="Search">
                            </button>
                        </span> 
                    </div>
                </form>
            </li>
            <li>
                <a class="download-button" href="https://code.visualstudio.com/Download">
                    <button class="download-btn">Download</button>
                </a>
            </li>
        </ul>
        
    </div>

    <div class="updates-container">
        <div class="Inner-Updates-Container">
            <p class="Updates-Message">
                🚀 Get 
                <a href="https://code.visualstudio.com/docs/copilot/setup-simplified" id="banner-link-updates" rel="noopener">Github Copilot Free</a>
                in VS Code!
            </p>
        </div>
    </div>
    <div class="hero-text">
        <h1 id="hero-text">Your code editor.   Redefined with AI.</h1>
        <div class="Download-Content">
            <div class="Primary-Buttons">
                <button type="button" class="download-for-windows-button" data-os="win">Dowload for Windows</button>
                <button type="button" class="Git-Copilot-Button" data-os="win">Git Copilot Free</button>
            </div>
            <p id="Dowload-Matrix-Label">
                <a href="https://vscode.dev/" target="_blank" rel="noopener" title="For quick code edits locally or remotely on Github and Azure repos" id="download-button-insiders">Web</a>
                , 
                <a href="/insiders" id="download-button-insiders">Insiders Edition</a>
                , or 
                <a href="/Download" id="download-button-insiders">other platforms</a>
            </p>
            <p class="terms">
                "By using vs code you agree to its "
                <span class="wrap-together">
                    <a href="https://code.visualstudio.com/license" target="_blank" title="view the visual code license">license</a>
                    " and "
                    <a href="https://www.microsoft.com/en-us/privacy/privacystatement" target="_blank"  title="view the microsoft privacy  statement.">privacy statement</a>
                    "."
                </span>
            </p>
        </div>
    </div>
    <div class="demo-video-container">
        <img width="1240" height="831"   src="images/Demo-Background-Image.webp" alt="presentational background for video"
    </div>
</body>
