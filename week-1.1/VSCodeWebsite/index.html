<head>
    <title>
        Visual Studio Code
    </title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="header">
        <ul>
            <img src="images/VSCode.png" style="width: 25px; height: 25px; left: -168px; position: relative;">
                
            <li class="VSCode-Link">
               <a href="https://code.visualstudio.com/">Visual Studio Code</a>
            </li>
            <li class="Docs-Link">
                <a href="https://code.visualstudio.com/docs">Docs</a>
            </li>
            <li class="Updates-Link">
                <a href="https://code.visualstudio.com/updates/v1_96">Updates</a>
            </li>
            <li class="Blog-Link">
                <a href="https://code.visualstudio.com/blogs/2024/12/18/free-github-copilot">Blog</a>
            </li>
            <li class="API-Link">
                <a href="https://code.visualstudio.com/api">API</a>
            </li>
            <li class="Extensions-Link">
                <a href="https://marketplace.visualstudio.com/VSCode">Extensions</a>
            </li>
            <li class="FAQ-Link">
                <a href="https://code.visualstudio.com/docs/supporting/faq">FAQ</a>
            </li>
            <li class="GithubCopilot-Link">
                <a href="https://code.visualstudio.com/docs/copilot/overview">Github Copilot</a>
            </li>

            <li>
                <button class="theme">
                    <img class="theme-icon-light" src="https://code.visualstudio.com/assets/icons/theme-light.svg" alt="Switch to dark theme">
                </button>
            </li>
            <li class="search">
                <form class="nav-search search-form" role="search" aria-label="Search">
                    <div class="input-group" role="presentation">
                        <input type="text" name="q" class="search-box form-control" placeholder="Search Docs" aria-label="Search-text">
                        <span class="input-group-btn">
                            <button tabindex="0" class="btn" type="submit" aria-label="Search">
                                <img class="search-icon-dark" src="https://code.visualstudio.com/assets/icons/search-dark.svg" alt="Search">
                            </button>
                        </span> 
                    </div>
                </form>
            </li>
            <li>
                <a class="download-button" href="https://code.visualstudio.com/Download">
                    <button class="download-btn">Download</button>
                </a>
            </li>
        </ul>
        
    </div>

    <div class="">

    </div>
</body>
